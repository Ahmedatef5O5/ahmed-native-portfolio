<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042C53"/>
      <stop offset="100%" stop-color="#064060"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4eb7f2"/>
      <stop offset="100%" stop-color="#185FA5"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4eb7f2"/>
      <stop offset="100%" stop-color="#185FA5"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cd87a"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3735e"/>
      <stop offset="100%" stop-color="#993C1D"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#iconBg)"/>

  <!-- Decorative dots grid (subtle) -->
  <g opacity="0.08">
    <circle cx="128" cy="128" r="3" fill="#4eb7f2"/>
    <circle cx="192" cy="128" r="3" fill="#4eb7f2"/>
    <circle cx="256" cy="128" r="3" fill="#4eb7f2"/>
    <circle cx="384" cy="128" r="3" fill="#4eb7f2"/>
    <circle cx="128" cy="192" r="3" fill="#4eb7f2"/>
    <circle cx="384" cy="192" r="3" fill="#4eb7f2"/>
    <circle cx="128" cy="384" r="3" fill="#4eb7f2"/>
    <circle cx="192" cy="384" r="3" fill="#4eb7f2"/>
    <circle cx="384" cy="384" r="3" fill="#4eb7f2"/>
  </g>

  <!-- Outer ring accent -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="#4eb7f2" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Inner glow circle -->
  <circle cx="256" cy="256" r="155" fill="#4eb7f2" fill-opacity="0.05"/>

  <!-- Chart bars (main icon element) -->
  <!-- Bar 1 (left - medium blue) -->
  <rect x="136" y="230" width="56" height="140" rx="12" fill="url(#barGrad1)"/>

  <!-- Bar 2 (middle - tallest, green) -->
  <rect x="228" y="162" width="56" height="208" rx="12" fill="url(#barGrad2)"/>

  <!-- Bar 3 (right - red/shorter) -->
  <rect x="320" y="196" width="56" height="174" rx="12" fill="url(#barGrad3)"/>

  <!-- Trend line over bars -->
  <polyline
    points="164,248 256,180 348,214"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.9"
  />

  <!-- Dots on trend line -->
  <circle cx="164" cy="248" r="7" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="256" cy="180" r="7" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="348" cy="214" r="7" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Horizontal baseline -->
  <line x1="116" y1="370" x2="396" y2="370" stroke="#4eb7f2" stroke-width="2.5" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- "FD" monogram at top right as accent -->
  <text x="390" y="106" text-anchor="end" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#4eb7f2" fill-opacity="0.6" letter-spacing="-1">FD</text>

  <!-- Bottom label bar -->
  <rect x="156" y="400" width="200" height="36" rx="10" fill="#4eb7f2" fill-opacity="0.15"/>
  <text x="256" y="423" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#4eb7f2" letter-spacing="3">FINDASH</text>
</svg>
